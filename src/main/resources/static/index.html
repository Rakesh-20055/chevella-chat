<!DOCTYPE html>
<html>
<head>
    <title>Chevella Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{font-family:Arial;background:#e5ddd5;margin:0}
        .header{background:#075E54;color:white;padding:12px;display:flex;align-items:center;gap:10px}
        .loginBox{max-width:320px;margin:60px auto;background:white;padding:25px;border-radius:15px;text-align:center}
        .loginBox input{width:90%;padding:12px;margin:8px;border:1px solid #ddd;border-radius:10px}
        .loginBox button{width:95%;padding:12px;background:#25D366;border:none;color:white;border-radius:10px;font-weight:bold;font-size:16px}
        .topBtns{display:flex;gap:6px;padding:10px;background:#f0f0f0;flex-wrap:wrap}
        .topBtns button{flex:1;padding:11px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;min-width:110px}
        .chatItem{display:flex;align-items:center;gap:12px;background:white;padding:12px;border-bottom:1px solid #eee;cursor:pointer}
        .chatItem span{font-size:13px;color:gray}
        .hideBtn{background:#ff9500;color:white;border:none;padding:6px 10px;border-radius:8px;font-size:12px}
        #chat{height:280px;overflow-y:auto;padding:12px}
        .msg{background:white;padding:10px;margin:8px;border-radius:10px;max-width:75%;position:relative;cursor:pointer}
        .msg.ai{background:#dcf8c6}
        .msg b{color:#075E54;font-size:13px}
        .del{position:absolute;top:3px;right:6px;background:none;border:none;color:#999;cursor:pointer}
        .box{display:flex;padding:8px;background:white;gap:5px}
        .box input{flex:1;padding:12px;border:1px solid #ddd;border-radius:20px}
        .box button{background:#25D366;color:white;border:none;padding:12px 14px;border-radius:20px;font-weight:bold}
        .schedBar{display:flex;gap:5px;padding:8px;background:#fff3cd;align-items:center}
        .schedBar input{flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:12px}
        .schedBar button{background:#ff9500;color:white;border:none;padding:8px 10px;border-radius:8px;font-weight:bold}
        .popup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:100}
        .popupBox{background:white;padding:20px;border-radius:15px;width:300px;text-align:center;max-height:80vh;overflow-y:auto}
        .popupBox input{width:90%;padding:10px;margin:8px;border:1px solid #ddd;border-radius:10px}
        .popupBox button{display:block;width:100%;margin:8px 0;padding:12px;border:none;border-radius:10px;font-weight:bold}
        .checkRow{text-align:left;padding:6px}
        .memberRow{display:flex;justify-content:space-between;align-items:center;background:#f9f9f9;padding:10px;margin:6px 0;border-radius:10px}
        .memberRow button{width:auto !important;padding:6px 10px !important;margin:0 !important;background:#ff3b30 !important;color:white}
        .groupInfo{background:#e8f5e9;padding:10px;text-align:center;font-size:13px}
        .groupInfo button{padding:6px 10px;border:none;border-radius:8px;font-weight:bold;margin:2px}
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="loginBox"><h2>💬 Chevella Chat</h2><p>Your Secure WhatsApp</p>
        <input id="loginName" placeholder="Your Name"><input id="loginPin" type="password" placeholder="PIN">
        <button onclick="login()">Login 🔒</button></div>
</div>

<div id="listScreen" style="display:none">
    <div class="header"><div style="flex:1"><b id="myNameShow">My Name</b><br><span style="font-size:12px">Online • My Profile</span></div>
        <button onclick="logout()" style="background:#ff3b30;color:white;border:none;padding:7px 12px;border-radius:10px">Logout</button></div>
    <div class="topBtns">
        <button style="background:#25D366;color:white" onclick="openGroupPopup()">+ New Group 👥</button>
        <button style="background:#075E54;color:white" onclick="openChat('Chevella AI 🤖')">🤖 AI Chat</button>
        <button style="background:#ff9500;color:white" onclick="showHidden()">🙈 Hidden</button>
        <button style="background:#8e44ad;color:white" onclick="openAddPerson()">+ Add Person 👤</button>
    </div>
    <div id="chatList"></div>
    <div id="hiddenArea" style="display:none;padding:10px;background:#fff3cd;text-align:center">
        <b>🔒 Hidden Chats</b><br><input id="hiddenPin" type="password" placeholder="Enter PIN" style="padding:10px;margin:8px;border-radius:8px;border:1px solid #ddd;width:70%">
        <br><button onclick="unlockHidden()" style="background:#075E54;color:white;padding:10px 15px;border:none;border-radius:8px">Unlock 🙈</button>
        <div id="hiddenList"></div>
    </div>
</div>

<div id="chatScreen" style="display:none">
    <div class="header"><button onclick="showList()" style="background:none;border:none;color:white;font-size:20px">←</button>
        <div style="flex:1"><b id="chatWith">Raja</b><br><span id="chatStatus" style="font-size:12px">Online</span></div>
        <button onclick="hideCurrentChat()" style="background:#ff9500;color:white;border:none;padding:7px 8px;border-radius:8px;font-size:12px">Hide 🙈</button>
        <button onclick="openAddMember()" style="background:#25D366;color:white;border:none;padding:7px 8px;border-radius:8px;font-size:12px">+ Add</button>
        <button onclick="openMembersList()" style="background:white;color:#075E54;border:none;padding:7px 8px;border-radius:8px;font-size:12px">Members 👥</button>
    </div>
    <div id="groupInfoBar" class="groupInfo" style="display:none"></div>
    <div id="chat"></div>
    <div class="schedBar">⏰ <input id="schedTime" type="datetime-local"><button onclick="scheduleMsg()">Schedule</button></div>
    <div class="box"><input id="text" placeholder="Type a message..."><button onclick="send()">Send ➤</button></div>
    <p style="text-align:center;font-size:12px;color:gray;margin:2px">Tap message = Mark Read 😊 • Group = Add / Remove Members</p>
</div>

<div id="groupPopup" class="popup"><div class="popupBox"><h3>Create Your Own Group 👥</h3>
    <input id="groupName" placeholder="Group Name"><div id="memberList"></div>
    <button style="background:#25D366;color:white" onclick="createGroup()">Create Group ✅</button>
    <button style="background:#eee" onclick="closeGroupPopup()">Cancel</button></div></div>

<div id="addPersonPopup" class="popup"><div class="popupBox"><h3>Add New Person 👤</h3>
    <input id="newPersonName" placeholder="Name - Ex: Suresh"><input id="newPersonPhone" placeholder="Phone (Optional)">
    <button style="background:#8e44ad;color:white" onclick="addPerson()">Add Person ✅</button>
    <button style="background:#eee" onclick="closeAddPerson()">Cancel</button></div></div>

<div id="addMemberPopup" class="popup"><div class="popupBox"><h3>Add Member to <span id="addMemberGroupName"></span></h3>
    <div id="addMemberList"></div>
    <button style="background:#25D366;color:white" onclick="saveAddMembers()">Add Selected ✅</button>
    <button style="background:#eee" onclick="closeAddMember()">Cancel</button></div></div>

<div id="membersPopup" class="popup"><div class="popupBox"><h3>Members of <span id="membersGroupName"></span> 👥</h3>
    <div id="membersListShow"></div>
    <button style="background:#25D366;color:white" onclick="openAddMemberFromList()">+ Add New Member</button>
    <button style="background:#eee" onclick="closeMembers()">Close</button></div></div>

<div id="deletePopup" class="popup"><div class="popupBox"><h3>Delete Message?</h3>
    <button style="background:#8e8e93;color:white" onclick="deleteForMe()">Delete for Me</button>
    <button style="background:#ff3b30;color:white" onclick="deleteForEveryone()">Delete for Everyone</button>
    <button style="background:#eee" onclick="closePopup()">Cancel</button></div></div>

<script>
    let myName=localStorage.getItem('chevella_name');
    let myPin=localStorage.getItem('chevella_pin');
    let currentChat='Raja'; let selectedId=null;
    let hiddenIds=JSON.parse(localStorage.getItem('hiddenIds')||'[]');
    let hiddenChats=JSON.parse(localStorage.getItem('hiddenChats')||'[]');
    let readIds=JSON.parse(localStorage.getItem('readIds')||'[]');
    let scheduled=JSON.parse(localStorage.getItem('scheduled')||'[]');
    let groupMembers=JSON.parse(localStorage.getItem('groupMembers')||'{}'); // { "GroupName": ["Raja","Priya"] }

    let defaultContacts=[
        {name:'Raja',emoji:'👦',last:'Hi bro!',time:'10:30 AM'},
        {name:'Priya',emoji:'👧',last:'Ok 😊',time:'Yesterday'},
        {name:'Chevella AI 🤖',emoji:'🤖',last:'Hello! I am AI',time:'9:00 AM'},
    ];
    let myGroups=JSON.parse(localStorage.getItem('myGroups')||'[]');
    let contacts=[...defaultContacts,...myGroups];
    let allPeople=JSON.parse(localStorage.getItem('allPeople')||'["Raja","Priya","Amma","Nanna","Suresh"]');
    let savedContacts=JSON.parse(localStorage.getItem('myContacts')||'[]');
    savedContacts.forEach(sc=>{ if(!contacts.find(c=>c.name===sc.name)) contacts.push(sc); });

    function saveAll(){ localStorage.setItem('myGroups',JSON.stringify(myGroups)); localStorage.setItem('myContacts',JSON.stringify(contacts)); localStorage.setItem('allPeople',JSON.stringify(allPeople)); localStorage.setItem('groupMembers',JSON.stringify(groupMembers)); }

    function login(){let n=document.getElementById('loginName').value;let p=document.getElementById('loginPin').value;if(!n||!p){alert('Enter Name + PIN');return;}localStorage.setItem('chevella_name',n);localStorage.setItem('chevella_pin',p);myName=n;myPin=p;showList();}
    function logout(){if(confirm('Logout?')){localStorage.removeItem('chevella_name');localStorage.removeItem('chevella_pin');location.reload();}}
    function showList(){
        document.getElementById('loginScreen').style.display='none';document.getElementById('chatScreen').style.display='none';document.getElementById('listScreen').style.display='block';document.getElementById('hiddenArea').style.display='none';
        document.getElementById('myNameShow').innerText=myName;
        let list=document.getElementById('chatList');list.innerHTML='';
        contacts.forEach(c=>{
            if(hiddenChats.includes(c.name)) return;
            list.innerHTML+=`<div class="chatItem"><div onclick="openChat('${c.name}')" style="display:flex;align-items:center;gap:12px;flex:1"><div style="width:50px;height:50px;border-radius:50%;background:#dcf8c6;display:flex;align-items:center;justify-content:center;font-size:26px">${c.emoji}</div><div style="flex:1"><b>${c.name}</b><br><span>${c.last}</span></div><span>${c.time}</span></div><button class="hideBtn" onclick="hideChat('${c.name}')">Hide 🙈</button></div>`;
        });
    }
    function hideChat(name){hiddenChats.push(name);localStorage.setItem('hiddenChats',JSON.stringify(hiddenChats));alert(name+' Hidden! 🙈');showList();}
    function hideCurrentChat(){hideChat(currentChat);showList();}
    function showHidden(){document.getElementById('hiddenArea').style.display='block';}
    function unlockHidden(){let pin=document.getElementById('hiddenPin').value;if(pin!==myPin){alert('Wrong PIN!');return;}let h=document.getElementById('hiddenList');h.innerHTML='<br><b>Hidden Chats:</b><br>';hiddenChats.forEach(name=>{h.innerHTML+=`<div style="background:white;padding:12px;margin:8px;border-radius:10px;display:flex;justify-content:space-between"><b>${name}</b><button onclick="unhideChat('${name}')" style="background:#25D366;color:white;border:none;padding:6px 10px;border-radius:8px">Unhide</button> <button onclick="openChat('${name}')" style="background:#075E54;color:white;border:none;padding:6px 10px;border-radius:8px">Open</button></div>`;});if(hiddenChats.length==0)h.innerHTML+='No Hidden Chats';}
    function unhideChat(name){hiddenChats=hiddenChats.filter(n=>n!==name);localStorage.setItem('hiddenChats',JSON.stringify(hiddenChats));showList();alert(name+' Unhidden ✅');}

    function openGroupPopup(){document.getElementById('groupPopup').style.display='flex';let m=document.getElementById('memberList');m.innerHTML='';allPeople.forEach(p=>{m.innerHTML+=`<div class="checkRow"><label><input type="checkbox" value="${p}"> ${p}</label></div>`;});}
    function closeGroupPopup(){document.getElementById('groupPopup').style.display='none';}
    function createGroup(){let gName=document.getElementById('groupName').value;if(!gName){alert('Enter Group Name');return;}let checked=[...document.querySelectorAll('#memberList input:checked')].map(e=>e.value);if(checked.length==0){alert('Select 1 member');return;}let fullName=gName+' 👥';let newGroup={name:fullName,emoji:'👥',last:'Group Created - '+checked.join(', '),time:'Now'};myGroups.push(newGroup);contacts.push(newGroup);groupMembers[fullName]=checked;saveAll();closeGroupPopup();showList();alert('Group Created! 🎉 '+gName);}

    // --- STEP 4 & 5 : ADD PERSON + ADD / REMOVE MEMBER ---
    function openAddPerson(){document.getElementById('addPersonPopup').style.display='flex';}
    function closeAddPerson(){document.getElementById('addPersonPopup').style.display='none';}
    function addPerson(){
        let name=document.getElementById('newPersonName').value;if(!name){alert('Enter Name');return;}
        if(contacts.find(c=>c.name===name)){alert('Already Exists!');return;}
        let newContact={name:name,emoji:'👤',last:'Hi! I am new',time:'Now'};contacts.push(newContact);
        if(!allPeople.includes(name)) allPeople.push(name);
        saveAll();closeAddPerson();showList();alert(name+' Added! ✅ Now add him to any Group!');
    }
    function openAddMember(){
        if(!currentChat.includes('👥')){alert('Open a Group first!');return;}
        document.getElementById('addMemberGroupName').innerText=currentChat;
        document.getElementById('addMemberPopup').style.display='flex';
        let m=document.getElementById('addMemberList');m.innerHTML='';
        let existing=groupMembers[currentChat]||[];
        allPeople.forEach(p=>{
            if(existing.includes(p)) return; // Already in group, don't show
            m.innerHTML+=`<div class="checkRow"><label><input type="checkbox" value="${p}"> ${p}</label></div>`;
        });
        if(m.innerHTML=='') m.innerHTML='<p>All people already in group. Add new person first!</p>';
    }
    function closeAddMember(){document.getElementById('addMemberPopup').style.display='none';}
    function saveAddMembers(){
        let checked=[...document.querySelectorAll('#addMemberList input:checked')].map(e=>e.value);
        if(checked.length==0){alert('Select 1 member');return;}
        if(!groupMembers[currentChat]) groupMembers[currentChat]=[];
        groupMembers[currentChat]=[...groupMembers[currentChat],...checked];
        contacts.forEach(c=>{if(c.name===currentChat){c.last='Added: '+checked.join(', ');c.time='Now';}});
        saveAll();closeAddMember();updateGroupBar();alert('Added! 🎉 '+checked.join(', '));
    }
    function openMembersList(){
        if(!currentChat.includes('👥')){alert('Open a Group to see Members!');return;}
        document.getElementById('membersGroupName').innerText=currentChat;
        document.getElementById('membersPopup').style.display='flex';
        renderMembers();
    }
    function closeMembers(){document.getElementById('membersPopup').style.display='none';}
    function renderMembers(){
        let list=document.getElementById('membersListShow');let members=groupMembers[currentChat]||[];
        if(members.length==0){list.innerHTML='<p>No members yet. Add some!</p>';return;}
        list.innerHTML='';
        members.forEach(m=>{
            list.innerHTML+=`<div class="memberRow"><span>👤 ${m} ${m===myName?'(You - Admin)':''}</span><button onclick="removeMember('${m}')">Remove ✖</button></div>`;
        });
    }
    function removeMember(name){
        if(!confirm('Remove '+name+' from group?')) return;
        groupMembers[currentChat]=groupMembers[currentChat].filter(n=>n!==name);
        contacts.forEach(c=>{if(c.name===currentChat){c.last='Removed: '+name;c.time='Now';}});
        saveAll();renderMembers();updateGroupBar();alert(name+' Removed! ❌');
    }
    function openAddMemberFromList(){closeMembers();openAddMember();}
    function updateGroupBar(){
        let bar=document.getElementById('groupInfoBar');
        if(currentChat.includes('👥')){
            let members=groupMembers[currentChat]||[];
            bar.style.display='block';
            bar.innerHTML=`👥 Members (${members.length}): ${members.join(', ')||'None'} &nbsp; <button style="background:#25D366;color:white" onclick="openAddMember()">+ Add</button> <button style="background:#075E54;color:white" onclick="openMembersList()">Manage / Remove</button>`;
        } else { bar.style.display='none'; }
    }

    function openChat(name){currentChat=name;document.getElementById('listScreen').style.display='none';document.getElementById('chatScreen').style.display='block';document.getElementById('chatWith').innerText=name;document.getElementById('chatStatus').innerText=name.includes('AI')?'AI Online 🤖':'Online';updateGroupBar();load();}
    function getAIReply(text){text=text.toLowerCase();if(text.includes('hi')||text.includes('hello'))return 'Hi '+myName+'! 😊 How are you?';if(text.includes('joke'))return 'Why did chicken cross road? To go to Chevella! 😂😂';if(text.includes('how are you'))return 'I am great! Always online for you 😊';if(text.includes('telugu'))return 'Nenu Telugu kuda matladutha! Em chestunnav? 😊';return 'Nice! 😊 Tell me more...';}
    async function send(){let t=document.getElementById('text').value;if(!t)return;await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:myName+' → '+currentChat,text:t})});document.getElementById('text').value='';if(currentChat.includes('AI')){setTimeout(async()=>{let reply=getAIReply(t);await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Chevella AI 🤖',text:reply})});load();},1000);}load();}
    function scheduleMsg(){let t=document.getElementById('text').value;let time=document.getElementById('schedTime').value;if(!t||!time){alert('Type message + Select Time');return;}scheduled.push({text:t,chat:currentChat,time:time,sender:myName});localStorage.setItem('scheduled',JSON.stringify(scheduled));document.getElementById('text').value='';alert('Scheduled! ⏰ '+time);}
    async function checkScheduled(){let now=new Date().toISOString().slice(0,16);let due=scheduled.filter(s=>s.time<=now);for(let s of due){await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:s.sender+' → '+s.chat+' ⏰ Scheduled',text:s.text})});}if(due.length>0){scheduled=scheduled.filter(s=>s.time>now);localStorage.setItem('scheduled',JSON.stringify(scheduled));if(document.getElementById('chatScreen').style.display=='block')load();}}
    function markRead(id){if(!readIds.includes(id)){readIds.push(id);localStorage.setItem('readIds',JSON.stringify(readIds));load();}}
    async function load(){let res=await fetch('/api/messages');let msgs=await res.json();let d=document.getElementById('chat');d.innerHTML='';msgs.forEach(m=>{if(hiddenIds.includes(m.id))return;let isAI=m.name.includes('AI');let emoji=readIds.includes(m.id)?'😊':'😢';let label=readIds.includes(m.id)?'Read 😊':'Delivered 😢';d.innerHTML+=`<div class="msg ${isAI?'ai':''}" onclick="markRead('${m.id}')"><button class="del" onclick="event.stopPropagation();openPopup('${m.id}')">✖</button><b>${m.name}</b><br>${m.text}<br><span style="font-size:12px;float:right">${emoji} ${label}</span></div>`;});d.scrollTop=d.scrollHeight;}
    function openPopup(id){selectedId=id;document.getElementById('deletePopup').style.display='flex';}
    function closePopup(){document.getElementById('deletePopup').style.display='none';}
    async function deleteForMe(){hiddenIds.push(selectedId);localStorage.setItem('hiddenIds',JSON.stringify(hiddenIds));closePopup();load();}
    async function deleteForEveryone(){await fetch('/api/messages/'+selectedId,{method:'DELETE'});closePopup();load();}
    if(myName&&myPin){showList();}
    setInterval(()=>{if(document.getElementById('chatScreen').style.display=='block')load();checkScheduled();},2000);
</script>
</body>
</html>
