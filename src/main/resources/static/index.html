<!DOCTYPE html>
<html>
<head>
    <title>Chevella Chat - Feelings</title>
    <style>
        *{box-sizing:border-box} body{font-family:Arial;margin:0;background:#ece5dd}
        #login{height:100vh;display:flex;align-items:center;justify-content:center;background:#075e54}
        .loginBox{background:white;padding:30px;border-radius:15px;text-align:center;width:320px}
        .loginBox input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #ccc}
        .loginBox button{width:100%;padding:12px;background:#25d366;border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer}
        #app{display:none;height:100vh;max-width:1100px;margin:0 auto;background:white}
        #left{width:32%;border-right:1px solid #ddd;display:flex;flex-direction:column}
        #profile{background:#075e54;color:white;padding:12px;display:flex;gap:10px;align-items:center}
        #profile input{background:transparent;border:none;border-bottom:1px solid white;color:white;font-size:17px;font-weight:bold;outline:none;width:130px}
        .avatar{width:45px;height:45px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;flex-shrink:0}
        .person{padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;border-bottom:1px solid #f0f0f0}
        .person.active{background:#ebebeb}
        #right{flex:1;display:flex;flex-direction:column}
        #chatHead{background:#ededed;padding:10px 15px;display:flex;gap:10px;align-items:center;font-weight:bold}
        #messages{flex:1;overflow-y:auto;padding:15px;background:#ece5dd}
        .msg{background:white;padding:8px 12px;margin:5px;border-radius:10px;max-width:75%;width:fit-content;position:relative}
        .msg.me{background:#dcf8c6;margin-left:auto}
        .msg b{font-size:11px;color:#075e54}
        .msg .time{font-size:10px;color:gray;display:block;text-align:right}
        #box{background:#f0f2f5;padding:10px}
        #boxRow{display:flex;gap:8px}
        #box input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
        #box button{padding:12px 14px;background:#25d366;border:none;border-radius:50%;color:white;cursor:pointer}
        #schedRow{display:flex;gap:8px;margin-top:8px;align-items:center;font-size:12px}
        .lock{font-size:11px;color:#075e54;text-align:center;padding:4px;background:#e8f5e9}
    </style>
</head>
<body>
<div id="login"><div class="loginBox"><h2>🔒 Chevella Chat</h2><p>Feelings Chat - Sad to Happy</p><input id="loginName" placeholder="Your Name"><input id="loginPass" type="password" placeholder="Password"><button onclick="doLogin()">Login Securely</button><p style="font-size:12px;color:gray">Demo Password: <b>1234</b></p><p id="loginErr" style="color:red"></p></div></div>
<div id="app">
    <div id="left">
        <div id="profile"><div class="avatar" style="background:#25d366">👤</div><input id="myName" value="Me"><button onclick="logout()" style="margin-left:auto;background:red;color:white;border:none;padding:6px 10px;border-radius:8px;cursor:pointer">Logout</button></div>
        <div style="padding:10px"><input id="searchBox" placeholder="🔍 Search chat..." style="width:100%;padding:10px;border-radius:20px;border:1px solid #ddd;background:#f0f2f5;outline:none" oninput="renderList()"></div>
        <div style="padding:0 10px 10px"><button onclick="toggleHidden()" style="width:100%;padding:8px;background:#333;color:white;border:none;border-radius:8px;cursor:pointer">🙈 Show Hidden Chats</button></div>
        <div id="chatList"></div>
        <div style="padding:10px;border-top:1px solid #ddd"><input id="newContact" placeholder="Add new person name"><button onclick="addContact()" style="padding:8px;background:#075e54;color:white;border:none;border-radius:8px;margin-top:5px;width:100%">+ Add Contact</button></div>
    </div>
    <div id="right">
        <div id="chatHead"><div class="avatar" id="headAvatar" style="background:#e91e63">P</div><div><div id="headName">Priya</div><small style="color:green;font-weight:normal">🔒 Encrypted • online</small></div><button onclick="hideChat()" style="margin-left:auto;background:#333;color:white;border:none;padding:6px 10px;border-radius:8px;cursor:pointer">🙈 Hide</button></div>
        <div class="lock">🔒 Encrypted • 😢 = Delivered • 😊 = Read / Seen</div>
        <div id="messages"></div>
        <div id="box">
            <div style="display:flex;gap:5px;margin-bottom:5px;font-size:20px;cursor:pointer"><span onclick="addEmoji('😀')">😀</span><span onclick="addEmoji('😍')">😍</span><span onclick="addEmoji('😂')">😂</span><span onclick="addEmoji('❤️')">❤️</span><span onclick="addEmoji('🔥')">🔥</span><span onclick="addEmoji('👍')">👍</span><span onclick="addEmoji('🙏')">🙏</span><span onclick="addEmoji('🎉')">🎉</span><span onclick="addEmoji('😢')">😢</span><span onclick="addEmoji('😊')">😊</span></div>
            <div id="boxRow"><input id="text" placeholder="Type a message"><button onclick="toggleSched()" title="Schedule">⏰</button><button onclick="send()">➤</button></div>
            <div id="schedRow" style="display:none"><span>⏰ Schedule for:</span><input type="datetime-local" id="schedTime"><button onclick="sendScheduled()" style="border-radius:8px;background:#075e54;color:white;border:none;padding:8px">Schedule Send</button><button onclick="toggleSched()" style="border-radius:8px;background:gray;color:white;border:none;padding:8px">Cancel</button></div>
        </div>
    </div>
</div>
<script>
    let contacts=[
        {name:"Priya", color:"#e91e63", hidden:false},
        {name:"Rahul", color:"#2196f3", hidden:false},
        {name:"Mom", color:"#ff9800", hidden:false},
        {name:"College Group", color:"#9c27b0", hidden:false},
        {name:"AI Bot 🤖", color:"#00bfa5", hidden:false},
        {name:"Best Friend", color:"#009688", hidden:false}
    ];
    let current="Priya";
    let myName="Me";
    let SECRET="chevella123";
    let showHidden=false;
    function encrypt(t){ return btoa(encodeURIComponent(SECRET+"::"+t)); }
    function decrypt(t){ try{ let d=decodeURIComponent(atob(t)); if(d.startsWith(SECRET+"::")) return d.split("::").slice(1).join("::"); return "🔒 Encrypted"; }catch(e){ return t; } }
    function addEmoji(e){ let b=document.getElementById('text'); b.value+=e; b.focus(); }
    function doLogin(){
        let n=document.getElementById('loginName').value;
        let p=document.getElementById('loginPass').value;
        if(!n){ document.getElementById('loginErr').innerText="Enter your name"; return; }
        if(p!=="1234"){ document.getElementById('loginErr').innerText="Wrong Password! Try 1234"; return; }
        myName=n; document.getElementById('myName').value=n;
        localStorage.setItem("chatUser", n);
        document.getElementById('login').style.display='none';
        document.getElementById('app').style.display='flex';
        renderList(); selectChat("Priya","#e91e63");
    }
    function logout(){ localStorage.removeItem("chatUser"); location.reload(); }
    function addContact(){ let n=document.getElementById('newContact').value.trim(); if(!n) return; contacts.push({name:n, color:"#"+Math.floor(Math.random()*16777215).toString(16), hidden:false}); document.getElementById('newContact').value=''; renderList(); }
    function toggleHidden(){ showHidden=!showHidden; renderList(); }
    function hideChat(){
        let c=contacts.find(x=>x.name===current);
        if(c){ c.hidden=true; alert("🙈 "+current+" Hidden! Click Show Hidden Chats to see again."); renderList(); selectChat("Priya","#e91e63"); }
    }
    function renderList(){
        let q=document.getElementById('searchBox').value.toLowerCase();
        let div=document.getElementById('chatList'); div.innerHTML='';
        contacts.filter(c=>c.name.toLowerCase().includes(q)).filter(c=> showHidden ? c.hidden : !c.hidden).forEach(c=>{
            div.innerHTML+=`<div class="person ${c.name===current?'active':''}" onclick="selectChat('${c.name}','${c.color}')"><div class="avatar" style="background:${c.color}">${c.name[0]}</div><div><b>${c.name}</b><div style="font-size:12px;color:gray">🔒 Click to chat</div></div>${c.hidden?'<button onclick="event.stopPropagation();unhideChat(\''+c.name+'\')">Unhide</button>':''}</div>`;
        });
        if(div.innerHTML==='') div.innerHTML='<p style="text-align:center;color:gray">No chats here</p>';
    }
    function unhideChat(name){ let c=contacts.find(x=>x.name===name); if(c) c.hidden=false; renderList(); }
    function selectChat(name,color){ current=name; document.getElementById('headName').innerText=name; document.getElementById('headAvatar').innerText=name[0]; document.getElementById('headAvatar').style.background=color; renderList(); load(); }
    function toggleSched(){ let r=document.getElementById('schedRow'); r.style.display=r.style.display==='none'?'flex':'none'; }
    async function load(){
        let res=await fetch('/api/messages'); let data=await res.json();
        let div=document.getElementById('messages'); div.innerHTML='';
        let now=new Date();
        for(let m of data){
            if(m.deletedFor===myName) continue;
            if(m.receiver!==current && m.sender!==current) continue;
            if(current!=="College Group" && m.receiver!==current && m.receiver!==myName){ if(!(m.sender===current && m.receiver===myName)) continue; }
            if(m.scheduledTime){ if(new Date(m.scheduledTime)>now) continue; }
            // Auto mark READ when you open chat - Sad -> Happy
            if(m.sender!==myName && m.status!=="READ" && m.receiver===myName){
                await fetch('/api/messages/'+m.id+'/read',{method:'PUT'});
                m.status="READ";
            }
            let text=decrypt(m.content);
            let me=m.sender===myName?'me':'';
            let time=m.createdAt?new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'';
            let statusEmoji = m.sender===myName ? (m.status==="READ" ? "😊" : "😢") : "";
            let schedTag=m.scheduledTime?'<span style="font-size:10px;color:#075e54"> ⏰ Scheduled</span>':'';
            div.innerHTML+=`<div class="msg ${me}"><b>${m.sender} ${schedTag}</b><br>${text}<span class="time">${time} ${statusEmoji}</span><div style="font-size:11px;margin-top:4px"><a href="#" onclick="delForMe(${m.id});return false;">Delete For Me</a> | <a href="#" onclick="delForEveryone(${m.id});return false;" style="color:red">Delete For Everyone</a></div></div>`;
        }
        div.scrollTop=div.scrollHeight;
    }
    async function send(){
        let content=document.getElementById('text').value; if(!content) return;
        await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:myName,receiver:current,content:encrypt(content)})});
        document.getElementById('text').value='';
        // AI CHAT
        if(current.includes("AI Bot")){
            setTimeout(async ()=>{
                let reply="Hi! I am AI Bot 🤖 I got your message: '"+content+"'. How can I help you today? 😊";
                if(content.toLowerCase().includes("hi")||content.toLowerCase().includes("hello")) reply="Hello! 😊 How are you? I am your AI Friend!";
                if(content.toLowerCase().includes("miss")) reply="Aww 🥹 I miss you too! Don't be sad 😢, I am here 😊";
                if(content.toLowerCase().includes("bye")) reply="Bye Bye 👋 Take care! Come back soon 😊";
                await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:"AI Bot 🤖",receiver:myName,content:encrypt(reply)})});
                load();
            },1000);
        }
        load();
    }
    async function sendScheduled(){
        let content=document.getElementById('text').value; let t=document.getElementById('schedTime').value;
        if(!content||!t){ alert("Type message + Select Time"); return; }
        await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sender:myName,receiver:current,content:encrypt(content),scheduledTime:t})});
        alert("⏰ Scheduled for "+t); document.getElementById('text').value=''; toggleSched(); load();
    }
    async function delForMe(id){ if(confirm("Delete For Me? Only you will not see it.")){ await fetch('/api/messages/'+id+'/deleteforme?user='+myName,{method:'PUT'}); load(); } }
    async function delForEveryone(id){ if(confirm("Delete For Everyone?")){ await fetch('/api/messages/'+id,{method:'DELETE'}); load(); } }
    document.getElementById('text').addEventListener('keypress',e=>{ if(e.key==='Enter') send(); });
    document.getElementById('myName').addEventListener('change',e=>{ myName=e.target.value; });
    let saved=localStorage.getItem("chatUser"); if(saved){ document.getElementById('loginName').value=saved; }
    renderList(); setInterval(load,2000);
</script>
</body>
</html>
